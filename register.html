<!DOCTYPE html>
<html>
<head>
  <title>Qeydiyyat - Altap.Biz</title>
  <style>body{font-family:sans-serif; padding:20px} input{display:block; margin:10px 0; padding:8px; width:250px} button{padding:10px 20px}</style>
</head>
<body>
  <h2>Qeydiyyat</h2>
  <form id="registerForm">
    <input type="text" id="full_name" placeholder="Ad Soyad" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Şifrə" required>
    <button type="submit">Qeydiyyat Ol</button>
  </form>
  <p id="msg" style="color:green; font-weight:bold"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://iubtzsfempgodtiyurpk.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_mY6ievftzM_hcNab4yyrCQ_1cBKQP7f'
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault()
      const { error } = await supabase.from('users').insert([{ 
        full_name: document.getElementById('full_name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      }])
      if(error) document.getElementById('msg').style.color='red', document.getElementById('msg').innerText = 'Xəta: ' + error.message
      else document.getElementById('msg').innerText = 'Qeydiyyat uğurlu! ✅'
    })
  </script>
</body>
</html>

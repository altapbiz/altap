<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Qeydiyyat - Altap.Biz</title>
  <style>
    body {font-family: sans-serif; padding: 20px; background: #f5f5f5}
    .box {background: white; padding: 20px; border-radius: 10px; max-width: 300px; margin: auto}
    input {display: block; margin: 10px 0; padding: 10px; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px}
    button {padding: 10px; width: 100%; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer}
    button:hover {background: #218838}
  </style>
</head>
<body>
  <div class="box">
    <h2>Qeydiyyat</h2>
    <form id="registerForm">
      <input type="text" id="full_name" placeholder="Ad Soyad" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Şifrə" required>
      <button type="submit">Qeydiyyat Ol</button>
    </form>
    <p id="msg"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://cdtozogkdnimetuzyhqn.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_tuMFC93Lepe-F-RD4XJgMw_wA4bo'
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault()
      const msg = document.getElementById('msg')
      msg.style.color='black'
      msg.innerText = 'Gözləyin...'
      
      const { error } = await supabase.from('users').insert([{ 
        full_name: document.getElementById('full_name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      }])
      
      if(error) {
        msg.style.color='red'
        msg.innerText = 'Xəta: ' + error.message
      } else {
        msg.style.color='green'
        msg.innerText = 'Qeydiyyat uğurlu! ✅'  // BURA DÜZƏLDİ
        document.getElementById('registerForm').reset() // BURA DA DÜZƏLDİ
      }
    })
  </script>
</body>
</html>

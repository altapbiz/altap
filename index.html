<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altap.Biz LIVE Race</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090909;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .race {
      max-width: 700px;
      margin: auto;
    }

    .country {
      background: #151515;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
    }

    .track {
      position: relative;
      height: 55px;
      background: #252525;
      border-radius: 12px;
      margin-top: 12px;
      overflow: hidden;
    }

    .car {
      position: absolute;
      left: 0;
      top: 7px;
      font-size: 38px;
      transition: left 0.5s ease;
    }

    .points {
      color: #00ff88;
      margin-top: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🏎️ Altap.Biz LIVE Race 🎁</h1>

  <div class="race" id="race"></div>

  <script>
    const API = "https://altap-production.up.railway.app";

    const countries = {
      az: { name: "Azərbaycan", flag: "🇦🇿" },
      tr: { name: "Türkiyə", flag: "🇹🇷" },
      ru: { name: "Rusiya", flag: "🇷🇺" },
      ge: { name: "Gürcüstan", flag: "🇬🇪" },
      ua: { name: "Ukrayna", flag: "🇺🇦" }
    };

    async function updateRace() {
      try {
        const response = await fetch(API + "/race");
        const data = await response.json();

        const race = document.getElementById("race");

        race.innerHTML = "";

        for (const id in countries) {
          const country = countries[id];
          const points = data[id]?.points || 0;

          const maxPoints = 5000;
          const position = Math.min((points / maxPoints) * 100, 95);

          race.innerHTML += `
            <div class="country">
              <div class="top">
                <span>${country.flag} ${country.name}</span>
                <span>${points} xal</span>
              </div>

              <div class="track">
                <div class="car" style="left:${position}%">
                  🏎️
                </div>
              </div>

              <div class="points">
                Məsafə: ${data[id]?.distance || 0}
              </div>
            </div>
          `;
        }

      } catch (error) {
        console.log("Server bağlantısı yoxdur:", error);
      }
    }

    updateRace();

    setInterval(updateRace, 1000);
  </script>

</body>
</html>

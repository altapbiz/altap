<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altap.Biz — Virtual Nömrələr</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{background:#f5f3fa;color:#17131f;padding-bottom:90px}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:540px;margin:auto;min-height:100vh}

header{
  background:linear-gradient(135deg,#6424d8,#9639ed);
  color:white;padding:20px 18px 24px;
  border-radius:0 0 28px 28px;
  box-shadow:0 8px 25px rgba(100,36,216,.25)
}
.header-top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:900}
.logo span{opacity:.65}
.profile{width:42px;height:42px;border-radius:50%;background:#ffffff22;display:grid;place-items:center;font-size:20px}
header h1{font-size:27px;margin-top:23px}
header p{font-size:13px;opacity:.8;margin-top:6px}

.search-wrap{padding:16px 18px}
.search{
  background:white;border-radius:16px;padding:13px 15px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 5px 18px #0000000a
}
.search input{border:0;outline:0;width:100%;font-size:15px}

.categories{
  display:flex;gap:8px;overflow-x:auto;padding:0 18px 16px
}
.categories::-webkit-scrollbar{display:none}
.cat{
  white-space:nowrap;border:0;background:white;color:#777;
  padding:9px 14px;border-radius:12px;font-size:12px;font-weight:700
}
.cat.active{background:#7229dc;color:white}

.section{
  padding:0 18px 12px;display:flex;
  justify-content:space-between;align-items:center
}
.section h2{font-size:19px}
.section span{font-size:12px;color:#7b32df;font-weight:700}

.numbers{padding:0 18px;display:grid;gap:13px}

.card{
  background:white;border-radius:20px;padding:16px;
  box-shadow:0 5px 18px #00000009
}
.card-top{display:flex;justify-content:space-between}
.country{display:flex;gap:10px;align-items:center}
.flag{
  width:44px;height:44px;border-radius:13px;
  background:#f2edff;display:grid;place-items:center;font-size:25px
}
.country h3{font-size:15px}
.country p{font-size:11px;color:#999;margin-top:3px}
.badge{
  background:#fff0c8;color:#a56b00;
  border-radius:8px;padding:5px 8px;
  font-size:9px;font-weight:900
}
.number{font-size:19px;font-weight:800;margin-top:17px}
.tags{display:flex;gap:6px;margin-top:8px}
.tag{
  background:#f5f3f7;color:#777;padding:5px 8px;
  border-radius:7px;font-size:10px
}
.card-bottom{
  border-top:1px solid #eeeaf1;margin-top:15px;padding-top:13px;
  display:flex;align-items:center;justify-content:space-between
}
.price{font-size:20px;font-weight:900;color:#7029dc}
.price small{font-size:10px;color:#999}
.buy{
  border:0;color:white;font-size:12px;font-weight:800;
  padding:11px 15px;border-radius:12px;
  background:linear-gradient(135deg,#6926d9,#9737ed)
}

.empty{text-align:center;padding:45px 20px;color:#999}
.empty div{font-size:40px;margin-bottom:10px}

.page{display:none}
.page.active{display:block}

/* KABINET */
.profile-box{
  margin:0 18px;background:white;border-radius:20px;
  padding:22px;text-align:center;box-shadow:0 5px 18px #00000009
}
.avatar{
  width:72px;height:72px;border-radius:50%;margin:auto;
  background:linear-gradient(135deg,#7029dc,#9b3df0);
  color:white;display:grid;place-items:center;font-size:30px
}
.profile-box h2{margin-top:10px;font-size:18px}
.profile-box p{font-size:12px;color:#999;margin-top:4px}
.account-row{
  margin:12px 18px 0;background:white;border-radius:16px;
  padding:17px;display:flex;justify-content:space-between
}
.account-row span:first-child{color:#777;font-size:13px}
.account-row span:last-child{font-weight:800;font-size:13px}

/* MODAL */
.modal{
  display:none;position:fixed;inset:0;background:#0008;
  z-index:200;align-items:flex-end;justify-content:center
}
.modal.show{display:flex}
.modal-box{
  background:white;width:100%;max-width:540px;
  border-radius:26px 26px 0 0;padding:22px
}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.close{
  border:0;background:#f1eff4;width:34px;height:34px;
  border-radius:50%;font-size:18px
}
.form-group{margin-top:14px}
.form-group label{font-size:12px;font-weight:700}
.form-group input,.form-group select{
  width:100%;margin-top:6px;border:1px solid #e2dfe7;
  border-radius:12px;padding:12px;outline:0;background:white
}
.submit{
  width:100%;border:0;background:#7129dd;color:white;
  padding:14px;border-radius:13px;margin-top:17px;font-weight:800
}

/* NAV */
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:540px;height:72px;background:#fffffff5;
  backdrop-filter:blur(15px);border-top:1px solid #eeeaf2;
  display:flex;align-items:center;justify-content:space-around;
  z-index:100
}
.nav-item{
  color:#96919e;text-align:center;font-size:9px;font-weight:700
}
.nav-item div{font-size:20px;margin-bottom:3px}
.nav-item.active{color:#7029dc}
.add{
  width:50px;height:50px;border-radius:16px;
  background:linear-gradient(135deg,#7029dc,#9938ee);
  color:white;display:grid;place-items:center;
  font-size:28px;box-shadow:0 7px 20px #7029dc55
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="header-top">
    <div class="logo">Altap<span>.Biz</span></div>
    <div class="profile" onclick="openPage('account')">👤</div>
  </div>

  <h1 id="headerTitle">Virtual Nömrələr</h1>
  <p id="headerText">WhatsApp və Telegram üçün nömrəni seç.</p>
</header>

<!-- ƏSAS -->
<section id="home" class="page active">

  <div class="search-wrap">
    <div class="search">
      🔎
      <input id="searchInput" type="text"
      placeholder="Ölkə, kod və ya nömrə axtar..."
      oninput="searchNumbers()">
    </div>
  </div>

  <div class="categories" id="categories">
    <button class="cat active" onclick="filterCountry('all',this)">Hamısı</button>
    <button class="cat" onclick="filterCountry('AZ',this)">🇦🇿 Azərbaycan</button>
    <button class="cat" onclick="filterCountry('US',this)">🇺🇸 ABŞ</button>
    <button class="cat" onclick="filterCountry('GB',this)">🇬🇧 İngiltərə</button>
    <button class="cat" onclick="filterCountry('DE',this)">🇩🇪 Almaniya</button>
    <button class="cat" onclick="filterCountry('TR',this)">🇹🇷 Türkiyə</button>
    <button class="cat" onclick="filterCountry('RU',this)">🇷🇺 Rusiya</button>
  </div>

  <div class="section">
    <h2>Mövcud nömrələr</h2>
    <span id="count">40 elan</span>
  </div>

  <div class="numbers" id="numbers"></div>

</section>

<!-- VIP -->
<section id="vip" class="page">

  <div class="search-wrap">
    <div class="search">
      🔎
      <input id="vipSearch" type="text"
      placeholder="VIP nömrə axtar..."
      oninput="searchVIP()">
    </div>
  </div>

  <div class="section">
    <h2>⭐ VIP nömrələr</h2>
    <span>Premium</span>
  </div>

  <div class="numbers" id="vipNumbers"></div>

</section>

<!-- AXTARIŞ -->
<section id="searchPage" class="page">

  <div class="search-wrap">
    <div class="search">
      🔎
      <input id="globalSearch" type="text"
      placeholder="Nömrə axtar..."
      oninput="globalSearch()">
    </div>
  </div>

  <div class="section">
    <h2>Axtarış</h2>
  </div>

  <div class="numbers" id="searchResults"></div>

</section>

<!-- KABİNET -->
<section id="account" class="page">

  <div style="height:20px"></div>

  <div class="profile-box">
    <div class="avatar">👤</div>
    <h2>Mənim kabinetim</h2>
    <p>Altap.Biz istifadəçisi</p>
  </div>

  <div class="account-row">
    <span>Sifarişlər</span>
    <span id="orderCount">0</span>
  </div>

  <div class="account-row">
    <span>VIP sifarişlər</span>
    <span>0</span>
  </div>

  <div class="account-row">
    <span>Hesab statusu</span>
    <span style="color:#20a464">Aktiv</span>
  </div>

</section>

<!-- BOTTOM NAV -->
<nav class="nav">

  <div class="nav-item active" onclick="openPage('home',this)">
    <div>⌂</div>
    Əsas
  </div>

  <div class="nav-item" onclick="openPage('vip',this)">
    <div>⭐</div>
    VIP
  </div>

  <div class="add" onclick="openAdd()">+</div>

  <div class="nav-item" onclick="openPage('searchPage',this)">
    <div>🔎</div>
    Axtarış
  </div>

  <div class="nav-item" onclick="openPage('account',this)">
    <div>👤</div>
    Kabinet
  </div>

</nav>

</div>


<!-- ELAN ƏLAVƏ ET MODAL -->
<div class="modal" id="addModal">
  <div class="modal-box">

    <div class="modal-head">
      <h2>Elan əlavə et</h2>
      <button class="close" onclick="closeAdd()">×</button>
    </div>

    <div class="form-group">
      <label>Ölkə</label>
      <select id="newCountry">
        <option>🇦🇿 Azərbaycan</option>
        <option>🇺🇸 ABŞ</option>
        <option>🇬🇧 İngiltərə</option>
        <option>🇩🇪 Almaniya</option>
        <option>🇫🇷 Fransa</option>
        <option>🇹🇷 Türkiyə</option>
        <option>🇷🇺 Rusiya</option>
        <option>🇬🇪 Gürcüstan</option>
      </select>
    </div>

    <div class="form-group">
      <label>Nömrə</label>
      <input id="newNumber" placeholder="+1 202 555 ****">
    </div>

    <div class="form-group">
      <label>Qiymət</label>
      <input id="newPrice" type="number" placeholder="15">
    </div>

    <button class="submit" onclick="addNumber()">
      Elanı əlavə et
    </button>

  </div>
</div>


<script>

/* WHATSAPP */
const whatsapp = "212649276900";

/*
  Nümunə inventar.
  Real satış üçün sonradan öz həqiqi nömrələrini
  buraya əlavə edə bilərsən.
*/
const numbers = [

{c:"AZ",f:"🇦🇿",country:"Azərbaycan",n:"+994 12 345 ****",p:15,v:true},

{c:"US",f:"🇺🇸",country:"ABŞ",n:"+1 202 555 ****",p:15,v:true},
{c:"US",f:"🇺🇸",country:"ABŞ",n:"+1 305 442 ****",p:18,v:false},
{c:"US",f:"🇺🇸",country:"ABŞ",n:"+1 415 731 ****",p:22,v:true},
{c:"US",f:"🇺🇸",country:"ABŞ",n:"+1 646 218 ****",p:20,v:false},
{c:"US",f:"🇺🇸",country:"ABŞ",n:"+1 917 654 ****",p:25,v:true},

{c:"GB",f:"🇬🇧",country:"İngiltərə",n:"+44 7400 123 ****",p:20,v:false},
{c:"GB",f:"🇬🇧",country:"İngiltərə",n:"+44 7700 456 ****",p:24,v:true},
{c:"GB",f:"🇬🇧",country:"İngiltərə",n:"+44 7900 321 ****",p:22,v:false},
{c:"GB",f:"🇬🇧",country:"İngiltərə",n:"+44 7300 777 ****",p:28,v:true},
{c:"GB",f:"🇬🇧",country:"İngiltərə",n:"+44 7500 888 ****",p:25,v:false},

{c:"DE",f:"🇩🇪",country:"Almaniya",n:"+49 151 234 ****",p:22,v:true},
{c:"DE",f:"🇩🇪",country:"Almaniya",n:"+49 152 555 ****",p:20,v:false},
{c:"DE",f:"🇩🇪",country:"Almaniya",n:"+49 160 789 ****",p:25,v:true},
{c:"DE",f:"🇩🇪",country:"Almaniya",n:"+49 170 321 ****",p:24,v:false},
{c:"DE",f:"🇩🇪",country:"Almaniya",n:"+49 175 999 ****",p:30,v:true},

{c:"FR",f:"🇫🇷",country:"Fransa",n:"+33 6 12 34 ** **",p:21,v:false},
{c:"FR",f:"🇫🇷",country:"Fransa",n:"+33 6 45 67 ** **",p:25,v:true},
{c:"FR",f:"🇫🇷",country:"Fransa",n:"+33 7 11 22 ** **",p:23,v:false},
{c:"FR",f:"🇫🇷",country:"Fransa",n:"+33 7 88 99 ** **",p:29,v:true},
{c:"FR",f:"🇫🇷",country:"Fransa",n:"+33 6 55 66 ** **",p:27,v:false},

{c:"TR",f:"🇹🇷",country:"Türkiyə",n:"+90 532 456 ****",p:25,v:true},
{c:"TR",f:"🇹🇷",country:"Türkiyə",n:"+90 535 123 ****",p:22,v:false},
{c:"TR",f:"🇹🇷",country:"Türkiyə",n:"+90 542 777 ****",p:28,v:true},
{c:"TR",f:"🇹🇷",country:"Türkiyə",n:"+90 545 888 ****",p:24,v:false},
{c:"TR",f:"🇹🇷",country:"Türkiyə",n:"+90 552 999 ****",p:30,v:true},

{c:"RU",f:"🇷🇺",country:"Rusiya",n:"+7 916 234 ****",p:20,v:false},
{c:"RU",f:"🇷🇺",country:"Rusiya",n:"+7 926 555 ****",p:22,v:true},
{c:"RU",f:"🇷🇺",country:"Rusiya",n:"+7 999 123 ****",p:25,v:false},
{c:"RU",f:"🇷🇺",country:"Rusiya",n:"+7 903 777 ****",p:28,v:true},
{c:"RU",f:"🇷🇺",country:"Rusiya",n:"+7 915 888 ****",p:24,v:false},

{c:"GE",f:"🇬🇪",country:"Gürcüstan",n:"+995 599 123 ****",p:18,v:true},
{c:"GE",f:"🇬🇪",country:"Gürcüstan",n:"+995 555 456 ****",p:20,v:false},
{c:"GE",f:"🇬🇪",country:"Gürcüstan",n:"+995 577 777 ****",p:25,v:true},
{c:"GE",f:"🇬🇪",country:"Gürcüstan",n:"+995 593 888 ****",p:22,v:false},
{c:"GE",f:"🇬🇪",country:"Gürcüstan",n:"+995 514 999 ****",p:27,v:true}

];

let currentCountry="all";


function card(item){

return `
<div class="card">

  <div class="card-top">

    <div class="country">
      <div class="flag">${item.f}</div>

      <div>
        <h3>${item.country}</h3>
        <p>Virtual nömrə</p>
      </div>
    </div>

    ${item.v ? '<div class="badge">⭐ VIP</div>' : ''}

  </div>

  <div class="number">${item.n}</div>

  <div class="tags">
    <span class="tag">WhatsApp</span>
    <span class="tag">Telegram</span>
  </div>

  <div class="card-bottom">

    <div class="price">
      ${item.p} <small>AZN</small>
    </div>

    <button class="buy"
      onclick="buy('${item.country}','${item.n}','${item.p}')">
      Nömrəni al
    </button>

  </div>

</div>`;
}


/* ƏSAS SİYAHI */
function render(list=numbers){

const box=document.getElementById("numbers");

if(!list.length){
box.innerHTML=`
<div class="empty">
<div>🔎</div>
Nəticə tapılmadı
</div>`;
}else{
box.innerHTML=list.map(card).join("");
}

document.getElementById("count").textContent=list.length+" elan";
}


/* ÖLKƏ FİLTRİ */
function filterCountry(country,button){

currentCountry=country;

document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));

if(button) button.classList.add("active");

let result=country==="all"
?numbers
:numbers.filter(x=>x.c===country);

render(result);
}


/* AXTARIŞ */
function searchNumbers(){

const q=document.getElementById("searchInput").value.toLowerCase();

let result=numbers.filter(x=>{

let text=(x.country+" "+x.n+" "+x.c).toLowerCase();

return text.includes(q);

});

if(currentCountry!=="all"){
result=result.filter(x=>x.c===currentCountry);
}

render(result);
}


/* VIP */
function renderVIP(list=numbers.filter(x=>x.v)){

const box=document.getElementById("vipNumbers");

if(!list.length){
box.innerHTML='<div class="empty"><div>⭐</div>VIP nömrə tapılmadı</div>';
return;
}

box.innerHTML=list.map(card).join("");
}


/* VIP AXTARIŞ */
function searchVIP(){

const q=document.getElementById("vipSearch").value.toLowerCase();

renderVIP(
numbers.filter(x=>
x.v &&
(x.country+" "+x.n+" "+x.c).toLowerCase().includes(q)
)
);
}


/* ÜMUMİ AXTARIŞ */
function globalSearch(){

const q=document.getElementById("globalSearch").value.toLowerCase();

const result=numbers.filter(x=>
(x.country+" "+x.n+" "+x.c).toLowerCase().includes(q)
);

const box=document.getElementById("searchResults");

box.innerHTML=result.length
?result.map(card).join("")
:'<div class="empty"><div>🔎</div>Nəticə tapılmadı</div>';
}


/* SƏHİFƏ KEÇİDİ */
function openPage(page,nav){

document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));

document.getElementById(page).classList.add("active");

document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));

if(nav) nav.classList.add("active");

if(page==="home"){
document.getElementById("headerTitle").textContent="Virtual Nömrələr";
document.getElementById("headerText").textContent="WhatsApp və Telegram üçün nömrəni seç.";
}

if(page==="vip"){
document.getElementById("headerTitle").textContent="VIP Nömrələr";
document.getElementById("headerText").textContent="Premium virtual nömrələr.";
renderVIP();
}

if(page==="searchPage"){
document.getElementById("headerTitle").textContent="Axtarış";
document.getElementById("headerText").textContent="İstədiyin virtual nömrəni tap.";
globalSearch();
}

if(page==="account"){
document.getElementById("headerTitle").textContent="Kabinet";
document.getElementById("headerText").textContent="Sifarişlərin və hesab məlumatların.";
}

window.scrollTo({top:0,behavior:"smooth"});
}


/* WHATSAPP SİFARİŞ */
function buy(country,number,price){

const message=
"Salam! Altap.Biz saytından sifariş vermək istəyirəm.%0A%0A"+
"🌍 Ölkə: "+country+"%0A"+
"📱 Nömrə: "+number+"%0A"+
"💰 Qiymət: "+price+" AZN";

let orders=Number(localStorage.getItem("orders")||0)+1;

localStorage.setItem("orders",orders);

document.getElementById("orderCount").textContent=orders;

window.location.href=
"https://wa.me/"+whatsapp+"?text="+message;
}


/* ELAN ƏLAVƏ ET */
function openAdd(){
document.getElementById("addModal").classList.add("show");
}

function closeAdd(){
document.getElementById("addModal").classList.remove("show");
}

function addNumber(){

const country=document.getElementById("newCountry").value;
const number=document.getElementById("newNumber").value;
const price=document.getElementById("newPrice").value;

if(!number || !price){
alert("Nömrə və qiyməti daxil et.");
return;
}

let flag="🌍";

if(country.includes("Azərbaycan"))flag="🇦🇿";
if(country.includes("ABŞ"))flag="🇺🇸";
if(country.includes("İngiltərə"))flag="🇬🇧";
if(country.includes("Almaniya"))flag="🇩🇪";
if(country.includes("Fransa"))flag="🇫🇷";
if(country.includes("Türkiyə"))flag="🇹🇷";
if(country.includes("Rusiya"))flag="🇷🇺";
if(country.includes("Gürcüstan"))flag="🇬🇪";

numbers.unshift({
c:"NEW",
f:flag,
country:country.replace(flag+" ",""),
n:number,
p:Number(price),
v:false
});

closeAdd();

document.getElementById("newNumber").value="";
document.getElementById("newPrice").value="";

render(numbers);

alert("Elan əlavə edildi.");

}


/* BAŞLANĞIC */
render(numbers);

document.getElementById("orderCount").textContent=
localStorage.getItem("orders")||0;

</script>

</body>
</html>

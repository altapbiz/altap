<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altap.Biz LIVE Race</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #070707;
  color: white;
  font-family: Arial, sans-serif;
  padding: 8px;
}

h1 {
  text-align: center;
  font-size: 20px;
  margin: 5px 0 10px;
}

.status {
  text-align: center;
  color: #aaa;
  font-size: 12px;
  margin-bottom: 8px;
}

.selected {
  text-align: center;
  color: #00ff88;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 8px;
}

.race {
  width: 100%;
  max-width: 600px;
  margin: auto;
}

.country {
  background: #151515;
  border-radius: 12px;
  padding: 8px;
  margin-bottom: 8px;
  border: 1px solid #292929;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: bold;
}

.selectBtn {
  margin-top: 6px;
  width: 100%;
  border: 0;
  border-radius: 7px;
  padding: 6px;
  background: #292929;
  color: white;
  font-size: 12px;
  font-weight: bold;
}

.selectBtn.active {
  background: #00a86b;
}

.track {
  position: relative;
  height: 48px;
  margin-top: 7px;
  background: repeating-linear-gradient(
    90deg,
    #303030 0px,
    #303030 25px,
    #202020 25px,
    #202020 50px
  );
  border-radius: 9px;
  overflow: hidden;
  border-bottom: 3px solid #777;
}

.car {
  position: absolute;
  left: 0;
  bottom: 1px;
  font-size: 30px;
  transition: left 0.8s linear;
}

.finish {
  position: absolute;
  right: 5px;
  top: 0;
  height: 100%;
  width: 5px;
  background: repeating-linear-gradient(
    45deg,
    white 0px,
    white 5px,
    black 5px,
    black 10px
  );
}

.points {
  margin-top: 4px;
  color: #00ff88;
  font-size: 11px;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>🏎️ Altap.Biz LIVE Race 🎁</h1>

<div class="status" id="status">
  🔴 Yarış başlayır...
</div>

<div class="selected" id="selected">
  Ölkə seçilməyib
</div>

<div class="race" id="race"></div>

<script>
const API = "https://altap-production.up.railway.app";

const countries = {
  az: { name: "Azərbaycan", flag: "🇦🇿" },
  tr: { name: "Türkiyə", flag: "🇹🇷" },
  ru: { name: "Rusiya", flag: "🇷🇺" },
  am: { name: "Ermənistan", flag: "🇦🇲" },
  ge: { name: "Gürcüstan", flag: "🇬🇪" }
};

let selectedCountry = null;

function selectCountry(id) {
  selectedCountry = id;

  document.getElementById("selected").textContent =
    countries[id].flag + " " +
    countries[id].name +
    " seçildi";

  document.querySelectorAll(".selectBtn").forEach(btn => {
    btn.classList.remove("active");
    btn.textContent = "Ölkəni seç";
  });

  const button = document.getElementById("btn-" + id);

  if (button) {
    button.classList.add("active");
    button.textContent = "✓ Seçildi";
  }
}

function createRace() {
  const race = document.getElementById("race");

  race.innerHTML = "";

  for (const id in countries) {
    race.innerHTML += `
      <div class="country">

        <div class="top">
          <span>
            ${countries[id].flag}
            ${countries[id].name}
          </span>

          <span id="points-${id}">
            0 xal
          </span>
        </div>

        <button
          class="selectBtn"
          id="btn-${id}"
          onclick="selectCountry('${id}')"
        >
          Ölkəni seç
        </button>

        <div class="track">
          <div class="finish"></div>

          <div class="car" id="car-${id}">
            🏎️
          </div>
        </div>

        <div class="points" id="distance-${id}">
          Məsafə: 0
        </div>

      </div>
    `;
  }
}

async function updateRace() {
  try {
    const response = await fetch(
      API + "/race?t=" + Date.now()
    );

    if (!response.ok) {
      throw new Error("Server xətası");
    }

    const data = await response.json();

    document.getElementById("status").textContent =
      "🟢 LIVE — Yarış canlı yenilənir";

    for (const id in countries) {

      const points =
        Number(data[id]?.points || 0);

      const distance =
        Number(data[id]?.distance || 0);

      const position =
        Math.min((points / 5000) * 92, 92);

      const car =
        document.getElementById("car-" + id);

      if (car) {
        car.style.left =
          position + "%";
      }

      document.getElementById(
        "points-" + id
      ).textContent =
        points + " xal";

      document.getElementById(
        "distance-" + id
      ).textContent =
        "Məsafə: " + distance;
    }

  } catch (error) {

    document.getElementById("status").textContent =
      "🔴 Serverə qoşulmaq mümkün olmadı";
  }
}

createRace();
updateRace();

setInterval(updateRace, 500);
</script>

</body>
</html>

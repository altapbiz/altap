<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALTAP.BİZ — Xəbərlər</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f5f7;
    color:#111;
}

header{
    background:#0b0b0b;
    color:white;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 12px rgba(0,0,0,.15);
}

.header{
    max-width:1200px;
    margin:auto;
    padding:17px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:27px;
    font-weight:900;
    letter-spacing:-1px;
}

.live{
    color:#ff3030;
    font-size:12px;
    font-weight:800;
}

nav{
    background:white;
    border-bottom:1px solid #ddd;
    overflow-x:auto;
}

.nav{
    max-width:1200px;
    margin:auto;
    padding:11px 15px;
    display:flex;
    gap:7px;
}

.nav button{
    border:0;
    background:#f0f1f2;
    padding:9px 15px;
    border-radius:20px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
}

.nav button.active{
    background:#111;
    color:white;
}

main{
    max-width:1200px;
    margin:25px auto;
    padding:0 15px;
}

.breaking{
    background:#d90000;
    color:white;
    border-radius:10px;
    padding:11px 15px;
    display:flex;
    gap:12px;
    align-items:center;
    margin-bottom:22px;
    overflow:hidden;
}

.breaking strong{
    white-space:nowrap;
}

.breaking span{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.heading h1{
    font-size:27px;
}

.updated{
    color:#777;
    font-size:12px;
}

.news-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 3px 15px rgba(0,0,0,.07);
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:0 7px 22px rgba(0,0,0,.12);
}

.card img{
    width:100%;
    height:205px;
    object-fit:cover;
    display:block;
    background:#ddd;
}

.card-body{
    padding:16px;
}

.category{
    color:#d00000;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    margin-bottom:7px;
}

.card h2{
    font-size:18px;
    line-height:1.4;
    margin-bottom:10px;
}

.card p{
    color:#666;
    font-size:14px;
    line-height:1.5;
    margin-bottom:13px;
}

.date{
    color:#999;
    font-size:12px;
}

.loading,
.error{
    grid-column:1/-1;
    background:white;
    border-radius:15px;
    padding:45px;
    text-align:center;
}

footer{
    background:#0b0b0b;
    color:#999;
    text-align:center;
    padding:30px 15px;
    margin-top:45px;
    font-size:13px;
}

@media(max-width:850px){
    .news-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){

    .header{
        padding:15px;
    }

    .logo{
        font-size:23px;
    }

    .news-grid{
        grid-template-columns:1fr;
    }

    .card img{
        height:220px;
    }

    .heading{
        display:block;
    }

    .updated{
        display:block;
        margin-top:7px;
    }

    .breaking{
        font-size:13px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header">
        <div class="logo">ALTAP.BİZ</div>
        <div class="live">● CANLI XƏBƏRLƏR</div>
    </div>
</header>

<nav>
    <div class="nav">

        <button class="active" onclick="setCategory('all',this)">
            Bütün xəbərlər
        </button>

        <button onclick="setCategory('azerbaijan',this)">
            Azərbaycan
        </button>

        <button onclick="setCategory('politics',this)">
            Siyasət
        </button>

        <button onclick="setCategory('economy',this)">
            İqtisadiyyat
        </button>

        <button onclick="setCategory('society',this)">
            Cəmiyyət
        </button>

        <button onclick="setCategory('regions',this)">
            Regionlar
        </button>

        <button onclick="setCategory('world',this)">
            Dünya
        </button>

        <button onclick="setCategory('sport',this)">
            İdman
        </button>

        <button onclick="setCategory('culture',this)">
            Mədəniyyət
        </button>

        <button onclick="setCategory('science',this)">
            Elm və təhsil
        </button>

        <button onclick="setCategory('weather',this)">
            Hava
        </button>

        <button onclick="setCategory('incident',this)">
            Hadisə
        </button>

    </div>
</nav>

<main>

    <div class="breaking">
        <strong>🔴 SON DƏQİQƏ</strong>
        <span id="breakingText">
            Xəbərlər yüklənir...
        </span>
    </div>

    <div class="heading">

        <h1 id="pageTitle">
            Son xəbərlər
        </h1>

        <div class="updated" id="updated">
            Yenilənir...
        </div>

    </div>

    <div class="news-grid" id="news">

        <div class="loading">
            Xəbərlər yüklənir...
        </div>

    </div>

</main>

<footer>
    © 2026 ALTAP.BİZ
    <br><br>
    Xəbərləri mənbə saytından oxumaq üçün xəbərin üzərinə klik edin.
</footer>


<script>

/*
==================================================
ALTAP.BİZ XƏBƏR SİSTEMİ
==================================================
*/

const newsBox =
document.getElementById("news");

const updated =
document.getElementById("updated");

const breakingText =
document.getElementById("breakingText");

const pageTitle =
document.getElementById("pageTitle");

let currentCategory = "all";


/*
AZƏRTAC Azərbaycan dilində RSS sistemi
*/

const RSS = {

    all:
    "https://azertag.az/rss-all",

    politics:
    "https://azertag.az/rss-all",

    economy:
    "https://azertag.az/rss-all",

    society:
    "https://azertag.az/rss-all",

    regions:
    "https://azertag.az/rss-all",

    world:
    "https://azertag.az/rss-all",

    sport:
    "https://azertag.az/rss-all",

    culture:
    "https://azertag.az/rss-all",

    science:
    "https://azertag.az/rss-all",

    weather:
    "https://azertag.az/rss-all",

    incident:
    "https://azertag.az/rss-all",

    azerbaijan:
    "https://azertag.az/rss-all"

};


/*
Kateqoriyalara görə sözlər
*/

const keywords = {

    politics:[
        "prezident",
        "hökumət",
        "nazir",
        "parlament",
        "siyasət",
        "millət vəkili",
        "xarici işlər",
        "diplomatik"
    ],

    economy:[
        "iqtisadiyyat",
        "manat",
        "bank",
        "vergi",
        "investisiya",
        "ixrac",
        "idxal",
        "neft",
        "qaz",
        "sahibkar",
        "maaş",
        "pensiya"
    ],

    society:[
        "cəmiyyət",
        "təhsil",
        "səhiyyə",
        "məktəb",
        "universitet",
        "həkim",
        "vətəndaş",
        "sosial"
    ],

    regions:[
        "Bakı",
        "Gəncə",
        "Sumqayıt",
        "Şəki",
        "Quba",
        "Qusar",
        "Lənkəran",
        "Şamaxı",
        "Şəmkir",
        "Ağcabədi",
        "Naxçıvan",
        "rayon"
    ],

    world:[
        "ABŞ",
        "Avropa",
        "Rusiya",
        "Ukrayna",
        "İran",
        "Türkiyə",
        "İsrail",
        "BMT",
        "Fransa",
        "Almaniya",
        "İngiltərə",
        "dünya"
    ],

    sport:[
        "futbol",
        "idman",
        "Qarabağ",
        "Neftçi",
        "Sabah",
        "UEFA",
        "çempionat",
        "güləş",
        "basketbol",
        "voleybol",
        "tennis"
    ],

    culture:[
        "mədəniyyət",
        "musiqi",
        "teatr",
        "kino",
        "aktyor",
        "müğənni",
        "sərgi",
        "muzey",
        "festival"
    ],

    science:[
        "elm",
        "təhsil",
        "universitet",
        "alim",
        "tədqiqat",
        "texnologiya",
        "süni intellekt",
        "rəqəmsal"
    ],

    weather:[
        "hava",
        "temperatur",
        "yağış",
        "qar",
        "külək",
        "isti",
        "soyuq",
        "proqnoz"
    ],

    incident:[
        "qəza",
        "yanğın",
        "hadisə",
        "xəsarət",
        "həlak",
        "saxlanılıb",
        "cinayət",
        "narkotik"
    ]

};


/*
Kateqoriya adları
*/

const names = {

    all:"Son xəbərlər",
    azerbaijan:"Azərbaycan",
    politics:"Siyasət",
    economy:"İqtisadiyyat",
    society:"Cəmiyyət",
    regions:"Regionlar",
    world:"Dünya",
    sport:"İdman",
    culture:"Mədəniyyət",
    science:"Elm və təhsil",
    weather:"Hava",
    incident:"Hadisə"

};


/*
Kateqoriyaya uyğun xəbər seçirik
*/

function matchesCategory(item,category){

    if(category === "all" ||
       category === "azerbaijan"){

        return true;
    }

    const text =
    (
        (item.title || "") +
        " " +
        (item.description || "")
    ).toLowerCase();

    const list =
    keywords[category] || [];

    return list.some(word =>
        text.includes(word.toLowerCase())
    );
}


/*
Şəkil
*/

function getImage(item){

    if(item.enclosure &&
       item.enclosure.link){

        return item.enclosure.link;
    }

    if(item.thumbnail){

        return item.thumbnail;
    }

    return
    "https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1000&q=80";
}


/*
Xəbər yükləmə
*/

async function loadNews(category="all"){

    currentCategory =
    category;

    pageTitle.innerText =
    names[category] || "Xəbərlər";


    newsBox.innerHTML = `
        <div class="loading">
            <h3>Xəbərlər yüklənir...</h3>
            <p style="margin-top:8px;color:#777">
                Ən son xəbərlər gətirilir
            </p>
        </div>
    `;


    const rssURL =
    RSS[category];


    const apiURL =
    "https://api.rss2json.com/v1/api.json?rss_url=" +
    encodeURIComponent(rssURL);


    try{

        const response =
        await fetch(apiURL);


        const data =
        await response.json();


        if(!data.items){

            throw new Error(
                "Xəbərlər tapılmadı"
            );

        }


        let items =
        data.items;


        /*
        Kateqoriya filtrindən keçiririk
        */

        if(category !== "all" &&
           category !== "azerbaijan"){

            items =
            items.filter(item =>
                matchesCategory(
                    item,
                    category
                )
            );

        }


        /*
        Ən yeni xəbərlər
        */

        items =
        items.slice(0,30);


        newsBox.innerHTML = "";


        if(items.length === 0){

            newsBox.innerHTML = `
                <div class="error">

                    <h3>
                        Bu bölmədə hazırda xəbər yoxdur.
                    </h3>

                    <p style="margin-top:8px;color:#777">
                        Bir az sonra yenidən yoxlayın.
                    </p>

                </div>
            `;

            return;
        }


        /*
        Son dəqiqə
        */

        breakingText.innerText =
        items[0].title || "Yeni xəbər";


        /*
        Kartlar
        */

        items.forEach(item => {

            const title =
            item.title ||
            "Başlıqsız xəbər";


            const description =
            item.description
            ? item.description
                .replace(/<[^>]*>/g,"")
                .trim()
                .slice(0,170)
            : "Ətraflı məlumat üçün xəbəri açın.";


            const image =
            getImage(item);


            const date =
            item.pubDate
            ? new Date(item.pubDate)
            : new Date();


            const card =
            document.createElement("article");


            card.className =
            "card";


            card.innerHTML = `

                <img
                    src="${image}"
                    alt="Xəbər"
                    onerror="
                    this.style.display='none'
                    "
                >

                <div class="card-body">

                    <div class="category">
                        AZƏRTAC
                    </div>

                    <h2>
                        ${title}
                    </h2>

                    <p>
                        ${description}
                        ${description ? "..." : ""}
                    </p>

                    <div class="date">
                        ${date.toLocaleString("az-AZ")}
                    </div>

                </div>
            `;


            card.onclick =
            function(){

                if(item.link){

                    window.open(
                        item.link,
                        "_blank"
                    );

                }

            };


            newsBox.appendChild(card);

        });


        updated.innerText =
        "Son yenilənmə: " +
        new Date()
        .toLocaleTimeString("az-AZ");

    }


    catch(error){

        console.error(error);


        newsBox.innerHTML = `

            <div class="error">

                <h3>
                    Xəbərləri yükləmək mümkün olmadı.
                </h3>

                <p style="margin-top:8px;color:#777">
                    Xəbər xidmətinə qoşulmaq mümkün olmadı.
                </p>

            </div>
        `;


        updated.innerText =
        "Yenilənmə xətası";

    }

}


/*
Kateqoriya dəyişməsi
*/

function setCategory(category,button){

    document
    .querySelectorAll(".nav button")
    .forEach(btn =>
        btn.classList.remove("active")
    );


    button.classList.add("active");


    loadNews(category);

}


/*
İlk açılış
*/

loadNews("all");


/*
Hər 5 dəqiqədən bir yenilə
*/

setInterval(
    function(){

        loadNews(
            currentCategory
        );

    },
    300000
);

</script>

</body>
</html>

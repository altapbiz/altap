<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WhatsApp Plus — Demo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #e8fff1, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 28px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
    }

    .icon {
      width: 105px;
      height: 105px;
      margin: 0 auto 22px;
      border-radius: 25px;
      background: #25D366;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 58px;
      box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
    }

    h1 {
      font-size: 27px;
      color: #111;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #777;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .price {
      font-size: 32px;
      font-weight: 800;
      color: #128C4A;
      margin-bottom: 20px;
    }

    .download {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 16px;
      background: #25D366;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .download:hover {
      background: #20bd5b;
      transform: translateY(-2px);
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #999;
      line-height: 1.5;
    }

    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      width: 100%;
      max-width: 350px;
      background: white;
      border-radius: 22px;
      padding: 28px;
      text-align: center;
    }

    .modal h2 {
      margin-bottom: 10px;
    }

    .modal p {
      color: #666;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .close {
      border: none;
      background: #128C4A;
      color: white;
      padding: 12px 25px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">💬</div>

    <h1>WhatsApp Plus — Demo</h1>

    <p class="subtitle">
      iPhone üçün hazırlanmış nümayiş səhifəsi.
    </p>

    <div class="price">10 AZN</div>

    <button class="download" onclick="showModal()">
      ⬇️ Yüklə — 10 AZN
    </button>

    <p class="note">
      Bu səhifə yalnız demo məqsədlidir və rəsmi WhatsApp tətbiqi deyil.
    </p>

  </div>


  <div class="modal-bg" id="modal">

    <div class="modal">

      <h2>⚠️ Yükləmə</h2>

      <p>
        Demo yükləməsinin qiyməti <b>10 AZN</b>-dir.
        Davam etməzdən əvvəl ödəniş tələb olunur.
      </p>

      <button class="close" onclick="closeModal()">
        Bağla
      </button>

    </div>

  </div>


  <script>
    function showModal() {
      document.getElementById("modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }
  </script>

</body>
</html>

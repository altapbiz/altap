<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Proqramlar</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#050505;
    color:white;
    min-height:100vh;
}

header{
    padding:28px 15px;
    text-align:center;
    background:linear-gradient(135deg,#111,#050505);
    border-bottom:1px solid #222;
}

header h1{
    font-size:28px;
    font-weight:900;
    letter-spacing:1px;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px 14px 40px;
}

.card{
    position:relative;
    background:linear-gradient(145deg,#151515,#090909);
    border:1px solid #292929;
    border-radius:22px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 8px 30px rgba(0,0,0,.45);
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:4px;
    height:100%;
    background:linear-gradient(#00ff88,#00aaff);
}

.info{
    margin-bottom:17px;
}

.name{
    font-size:19px;
    font-weight:800;
    margin-bottom:7px;
}

.price{
    font-size:22px;
    font-weight:900;
}

.download{
    width:100%;
    border:0;
    border-radius:14px;
    padding:15px;
    background:linear-gradient(90deg,#00e676,#00bfa5);
    color:#000;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.download:active{
    transform:scale(.97);
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.82);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal-box{
    width:100%;
    max-width:390px;
    background:#111;
    border:1px solid #333;
    border-radius:22px;
    padding:25px;
    text-align:center;
    box-shadow:0 15px 50px rgba(0,0,0,.7);
}

.modal-box h2{
    font-size:22px;
    margin-bottom:14px;
}

.modal-box p{
    color:#ddd;
    line-height:1.5;
    margin-bottom:20px;
}

.price-modal{
    color:#00ff88;
    font-size:20px;
    font-weight:900;
}

.buttons{
    display:flex;
    gap:10px;
}

.whatsapp,
.close{
    flex:1;
    padding:14px;
    border:0;
    border-radius:13px;
    font-weight:900;
    cursor:pointer;
}

.whatsapp{
    background:#25D366;
    color:#000;
}

.close{
    background:#292929;
    color:#fff;
}
</style>
</head>

<body>

<header>
    <h1>Premium Proqramlar</h1>
</header>

<div class="container">

    <div class="card">
        <div class="info">
            <div class="name">WhatsApp Plus İphone 2026</div>
            <div class="price">15 ₼</div>
        </div>
        <button class="download" onclick="showModal('WhatsApp Plus İphone 2026','15 ₼')">Yüklə</button>
    </div>

    <div class="card">
        <div class="info">
            <div class="name">Instagram Plus İphone 2026</div>
            <div class="price">10 ₼</div>
        </div>
        <button class="download" onclick="showModal('Instagram Plus İphone 2026','10 ₼')">Yüklə</button>
    </div>

    <div class="card">
        <div class="info">
            <div class="name">Telegram Plus İphone 2026</div>
            <div class="price">8.99 ₼</div>
        </div>
        <button class="download" onclick="showModal('Telegram Plus İphone 2026','8.99 ₼')">Yüklə</button>
    </div>

    <div class="card">
        <div class="info">
            <div class="name">Youtube Premium 2026</div>
            <div class="price">33.77 ₼</div>
        </div>
        <button class="download" onclick="showModal('Youtube Premium 2026','33.77 ₼')">Yüklə</button>
    </div>

    <div class="card">
        <div class="info">
            <div class="name">Netflix Premium 2026</div>
            <div class="price">29.39 ₼</div>
        </div>
        <button class="download" onclick="showModal('Netflix Premium 2026','29.39 ₼')">Yüklə</button>
    </div>

</div>

<div class="modal" id="modal">
    <div class="modal-box">
        <h2>Diqqət</h2>

        <p>
            <span id="program"></span>
            <br>
            <span class="price-modal" id="selectedPrice"></span>
            <br><br>
            proqram 1 illik üçün bu qiymətədir
        </p>

        <div class="buttons">
            <button class="whatsapp" onclick="goWhatsapp()">WhatsApp</button>
            <button class="close" onclick="closeModal()">Bağla</button>
        </div>
    </div>
</div>

<script>
let selectedProgram = "";

function showModal(program, price){
    selectedProgram = program;

    document.getElementById("program").textContent = program;
    document.getElementById("selectedPrice").textContent = price;

    document.getElementById("modal").style.display = "flex";
}

function closeModal(){
    document.getElementById("modal").style.display = "none";
}

function goWhatsapp(){
    window.location.href =
    "https://wa.me/994556145657?text=" +
    encodeURIComponent(selectedProgram);
}
</script>

</body>
</html>

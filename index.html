<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALTAP.BİZ — Xəbərlər</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    color:#111;
}

header{
    background:#111;
    color:white;
    padding:18px 15px;
    position:sticky;
    top:0;
    z-index:100;
}

.header{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:800;
}

.live{
    color:#ff3333;
    font-size:13px;
    font-weight:bold;
}

nav{
    background:white;
    border-bottom:1px solid #ddd;
    overflow-x:auto;
}

.nav{
    max-width:1100px;
    margin:auto;
    display:flex;
    gap:8px;
    padding:12px 15px;
}

.nav button{
    border:0;
    background:#eee;
    padding:10px 17px;
    border-radius:20px;
    font-weight:bold;
    cursor:pointer;
    white-space:nowrap;
}

.nav button.active{
    background:#111;
    color:white;
}

main{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.top h1{
    font-size:26px;
}

.updated{
    color:#777;
    font-size:12px;
}

.news{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
}

.card img{
    width:100%;
    height:190px;
    object-fit:cover;
    background:#ddd;
}

.content{
    padding:15px;
}

.content h2{
    font-size:18px;
    line-height:1.35;
    margin-bottom:10px;
}

.content p{
    color:#666;
    font-size:14px;
    line-height:1.5;
    margin-bottom:12px;
}

.date{
    color:#999;
    font-size:12px;
}

.loading{
    grid-column:1/-1;
    background:white;
    padding:40px;
    border-radius:15px;
    text-align:center;
}

footer{
    margin-top:40px;
    background:#111;
    color:#aaa;
    text-align:center;
    padding:25px;
    font-size:13px;
}

@media(max-width:800px){
    .news{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:550px){
    .news{
        grid-template-columns:1fr;
    }

    .card img{
        height:220px;
    }

    .top{
        display:block;
    }

    .updated{
        display:block;
        margin-top:7px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header">
        <div class="logo">ALTAP.BİZ</div>
        <div class="live">● CANLI XƏBƏRLƏR</div>
    </div>
</header>

<nav>
    <div class="nav">

        <button class="active"
        onclick="loadNews('Azerbaijan',this)">
        Azərbaycan
        </button>

        <button
        onclick="loadNews('World',this)">
        Dünya
        </button>

        <button
        onclick="loadNews('Sports',this)">
        İdman
        </button>

        <button
        onclick="loadNews('Technology',this)">
        Texnologiya
        </button>

    </div>
</nav>

<main>

    <div class="top">
        <h1>Son xəbərlər</h1>
        <div class="updated" id="updated">
            Xəbərlər yüklənir...
        </div>
    </div>

    <div class="news" id="news">

        <div class="loading">
            Xəbərlər yüklənir...
        </div>

    </div>

</main>

<footer>
    © 2026 ALTAP.BİZ — Bütün hüquqlar qorunur.
</footer>

<script>

const newsContainer = document.getElementById("news");
const updated = document.getElementById("updated");

let currentCategory = "Azerbaijan";

async function loadNews(category = "Azerbaijan", button = null){

    currentCategory = category;

    if(button){

        document
        .querySelectorAll(".nav button")
        .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");
    }

    newsContainer.innerHTML = `
        <div class="loading">
            Xəbərlər yüklənir...
        </div>
    `;

    const rssURL =
    `https://news.google.com/rss/search?q=${encodeURIComponent(category)}&hl=az&gl=AZ&ceid=AZ:az`;

    const apiURL =
    `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssURL)}`;

    try{

        const response = await fetch(apiURL);
        const data = await response.json();

        if(!data.items || data.items.length === 0){
            throw new Error("Xəbər yoxdur");
        }

        newsContainer.innerHTML = "";

        data.items.slice(0,18).forEach(item => {

            let image =
            item.enclosure?.link ||
            "https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=900&q=80";

            let text =
            item.description
            ? item.description.replace(/<[^>]*>/g,"").slice(0,160)
            : "Ətraflı məlumat üçün xəbərə daxil olun.";

            let date = new Date(item.pubDate);

            const card = document.createElement("div");

            card.className = "card";

            card.innerHTML = `
                <img
                    src="${image}"
                    onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=900&q=80'"
                >

                <div class="content">

                    <h2>${item.title}</h2>

                    <p>${text}...</p>

                    <div class="date">
                        ${date.toLocaleString("az-AZ")}
                    </div>

                </div>
            `;

            card.onclick = function(){
                window.open(item.link,"_blank");
            };

            newsContainer.appendChild(card);

        });

        updated.innerText =
        "Yeniləndi: " +
        new Date().toLocaleTimeString("az-AZ");

    }

    catch(error){

        newsContainer.innerHTML = `
            <div class="loading">
                <h3>Xəbərləri yükləmək mümkün olmadı.</h3>
                <p style="margin-top:8px;color:#777">
                    Bir az sonra yenidən cəhd edin.
                </p>
            </div>
        `;

        updated.innerText = "Xəta baş verdi";
    }
}


// Sayt açılan kimi xəbərləri gətir
loadNews();


// Hər 5 dəqiqədən bir yenilə
setInterval(function(){

    loadNews(currentCategory);

},300000);

</script>

</body>
</html>

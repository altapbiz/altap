<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altap.Biz</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#080808;
    color:white;
}

header{
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #222;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.add{
    background:#00ff88;
    color:#000;
    border:0;
    padding:11px 16px;
    border-radius:12px;
    font-weight:bold;
}

.container{
    padding:20px;
    max-width:700px;
    margin:auto;
}

.hero{
    text-align:center;
    padding:35px 10px;
}

.hero h1{
    font-size:35px;
    margin-bottom:10px;
}

.hero p{
    color:#aaa;
}

.search{
    width:100%;
    padding:16px;
    margin:20px 0;
    background:#151515;
    border:1px solid #292929;
    border-radius:14px;
    color:white;
    font-size:16px;
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:20px;
}

.categories button{
    white-space:nowrap;
    padding:11px 15px;
    border-radius:12px;
    border:1px solid #333;
    background:#151515;
    color:white;
}

.categories button.active{
    background:#00ff88;
    color:#000;
}

.card{
    background:#111;
    border:1px solid #252525;
    border-radius:18px;
    padding:18px;
    margin-bottom:12px;
}

.card h3{
    margin-bottom:8px;
}

.card p{
    color:#aaa;
    margin-bottom:10px;
}

.price{
    color:#00ff88;
    font-size:19px;
    font-weight:bold;
}

.card button{
    margin-top:12px;
    width:100%;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#222;
    color:white;
}

nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#101010;
    border-top:1px solid #252525;
    display:flex;
    justify-content:space-around;
    padding:13px 5px;
}

nav button{
    background:none;
    border:0;
    color:#aaa;
}

nav button:first-child{
    color:#00ff88;
}

.space{
    height:75px;
}
</style>
</head>

<body>

<header>
    <div class="logo">Altap</div>
    <button class="add" onclick="addListing()">+ Elan ver</button>
</header>

<div class="container">

<section class="hero">
    <h1>ALTAP</h1>
    <p>Ağstafa • Qazax • Tovuz</p>
    <p style="margin-top:8px;">Yerli elanlar bir yerdə.</p>
</section>

<input
    class="search"
    id="search"
    type="text"
    placeholder="🔍 Nə axtarırsınız?"
    oninput="searchListings()"
>

<div class="categories">
    <button class="active" onclick="filter('Hamısı',this)">Hamısı</button>
    <button onclick="filter('Satış',this)">Satış</button>
    <button onclick="filter('Xidmət',this)">Xidmət</button>
    <button onclick="filter('İş',this)">İş</button>
    <button onclick="filter('Xəbər',this)">Xəbər</button>
</div>

<div id="listings"></div>

<div class="space"></div>

</div>

<nav>
    <button onclick="location.reload()">⌂<br>Ana səhifə</button>
    <button onclick="filter('Hamısı',null)">▣<br>Elanlar</button>
    <button onclick="addListing()">＋<br>Elan ver</button>
    <button>♡<br>Seçilmiş</button>
    <button>♙<br>Profil</button>
</nav>

<script>

const listings = [

{
title:"iPhone 15 Pro",
category:"Satış",
price:"1 450 ₼",
text:"Təmiz vəziyyətdə iPhone 15 Pro."
},

{
title:"Avtomobil satılır",
category:"Satış",
price:"12 500 ₼",
text:"Ətraflı məlumat üçün əlaqə saxlayın."
},

{
title:"Telefon təmiri",
category:"Xidmət",
price:"Razılaşma ilə",
text:"iPhone və Android telefonların təmiri."
},

{
title:"İş elanı",
category:"İş",
price:"Ətraflı məlumat",
text:"Ağstafada işçi tələb olunur."
},

{
title:"Bölgə xəbərləri",
category:"Xəbər",
price:"Xəbərə bax",
text:"Ağstafa, Qazax və Tovuzdan son xəbərlər."
},

{
title:"Çatdırılma xidməti",
category:"Xidmət",
price:"Razılaşma ilə",
text:"Bölgə daxilində çatdırılma xidməti."
}

];

function showListings(data=listings){

const box=document.getElementById("listings");

box.innerHTML="";

data.forEach(item=>{

box.innerHTML+=`

<div class="card">

<h3>${item.title}</h3>

<p>${item.text}</p>

<div class="price">${item.price}</div>

<button onclick="contact('${item.title}')">
Əlaqə saxla
</button>

</div>

`;

});

}

function filter(category,button){

if(button){

document.querySelectorAll(".categories button")
.forEach(b=>b.classList.remove("active"));

button.classList.add("active");

}

if(category==="Hamısı"){

showListings();

}else{

showListings(
listings.filter(x=>x.category===category)
);

}

}

function searchListings(){

const text=document
.getElementById("search")
.value
.toLowerCase();

showListings(
listings.filter(x=>
x.title.toLowerCase().includes(text) ||
x.text.toLowerCase().includes(text)
)
);

}

function addListing(){

window.open(
"https://wa.me/994556145657?text=Salam%20Altap.Biz-də%20elan%20yerləşdirmək%20istəyirəm.",
"_blank"
);

}

function contact(title){

window.open(
"https://wa.me/994556145657?text=Salam,%20"+encodeURIComponent(title)+"%20elani%20ilə%20maraqlanıram.",
"_blank"
);

}

showListings();

</script>

</body>
</html>

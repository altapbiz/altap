<!DOCTYPE html>
<html lang="az">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altap.Biz — Virtual Nömrələr</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    background:#f5f3fa;
    color:#17131f;
    padding-bottom:85px;
}

button,input{font:inherit}
button{cursor:pointer}

.app{
    max-width:540px;
    min-height:100vh;
    margin:auto;
}

/* HEADER */
header{
    background:linear-gradient(135deg,#6424d8,#9839ed);
    color:#fff;
    padding:20px 18px 25px;
    border-radius:0 0 28px 28px;
    box-shadow:0 8px 25px rgba(100,36,216,.25);
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:26px;
    font-weight:900;
}

.logo span{opacity:.55}

.profile{
    width:42px;
    height:42px;
    border-radius:50%;
    background:rgba(255,255,255,.16);
    display:grid;
    place-items:center;
    font-size:20px;
}

header h1{
    font-size:27px;
    margin-top:22px;
}

header p{
    font-size:13px;
    opacity:.82;
    margin-top:6px;
}

/* PAGES */
.page{display:none}
.page.active{display:block}

/* SEARCH */
.search-wrap{padding:16px 18px}

.search{
    background:#fff;
    border-radius:16px;
    padding:13px 15px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 5px 18px rgba(0,0,0,.05);
}

.search input{
    width:100%;
    border:none;
    outline:none;
    font-size:15px;
    background:transparent;
}

/* CATEGORIES */
.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:0 18px 17px;
}

.categories::-webkit-scrollbar{display:none}

.cat{
    white-space:nowrap;
    border:none;
    background:#fff;
    color:#777;
    padding:9px 14px;
    border-radius:12px;
    font-size:12px;
    font-weight:700;
}

.cat.active{
    background:#7229dc;
    color:#fff;
}

/* SECTION */
.section{
    padding:0 18px 12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.section h2{font-size:19px}

.section span{
    color:#7229dc;
    font-size:12px;
    font-weight:700;
}

/* CARDS */
.numbers{
    padding:0 18px;
    display:grid;
    gap:13px;
}

.card{
    background:#fff;
    border-radius:20px;
    padding:16px;
    box-shadow:0 5px 18px rgba(0,0,0,.05);
}

.card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.country{
    display:flex;
    align-items:center;
    gap:10px;
}

.flag{
    width:44px;
    height:44px;
    border-radius:13px;
    background:#f2edff;
    display:grid;
    place-items:center;
    font-size:25px;
}

.country h3{font-size:15px}

.country p{
    color:#999;
    font-size:11px;
    margin-top:3px;
}

.badge{
    background:#fff0c8;
    color:#a56b00;
    border-radius:8px;
    padding:5px 8px;
    font-size:9px;
    font-weight:900;
}

.number{
    margin-top:17px;
    font-size:19px;
    font-weight:800;
}

.tags{
    display:flex;
    gap:6px;
    margin-top:8px;
}

.tag{
    background:#f5f3f7;
    color:#777;
    padding:5px 8px;
    border-radius:7px;
    font-size:10px;
}

.card-bottom{
    border-top:1px solid #eeeaf1;
    margin-top:15px;
    padding-top:13px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.price{
    color:#7029dc;
    font-size:20px;
    font-weight:900;
}

.price small{
    color:#999;
    font-size:10px;
}

.buy{
    border:none;
    color:#fff;
    background:linear-gradient(135deg,#6926d9,#9737ed);
    padding:11px 15px;
    border-radius:12px;
    font-size:12px;
    font-weight:800;
}

.buy:active{transform:scale(.96)}

/* EMPTY */
.empty{
    text-align:center;
    padding:45px 20px;
    color:#999;
}

.empty-icon{
    font-size:40px;
    margin-bottom:10px;
}

/* CABINET */
.profile-box{
    background:#fff;
    margin:20px 18px 0;
    padding:22px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 5px 18px rgba(0,0,0,.05);
}

.avatar{
    width:72px;
    height:72px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(135deg,#7029dc,#9b3df0);
    color:#fff;
    display:grid;
    place-items:center;
    font-size:30px;
}

.profile-box h2{
    margin-top:10px;
    font-size:18px;
}

.profile-box p{
    color:#999;
    font-size:12px;
    margin-top:4px;
}

.account-row{
    background:#fff;
    margin:12px 18px 0;
    padding:17px;
    border-radius:16px;
    display:flex;
    justify-content:space-between;
}

.account-row span:first-child{
    color:#777;
    font-size:13px;
}

.account-row span:last-child{
    font-size:13px;
    font-weight:800;
}

/* BOTTOM NAV */
.nav{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:100%;
    max-width:540px;
    height:72px;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(15px);
    border-top:1px solid #eeeaf2;
    display:flex;
    align-items:center;
    justify-content:space-around;
    z-index:100;
}

.nav-item{
    min-width:65px;
    text-align:center;
    color:#96919e;
    font-size:9px;
    font-weight:700;
}

.nav-item div{
    font-size:20px;
    margin-bottom:3px;
}

.nav-item.active{color:#7029dc}
</style>
</head>

/* KART YARAT */

function createCard(item){

    return `
        <div class="card">

            <div class="card-top">

                <div class="country">

                    <div class="flag">
                        ${item.f}
                    </div>

                    <div>

                        <h3>
                            ${item.country}
                        </h3>

                        <p>
                            Virtual nömrə
                        </p>

                    </div>

                </div>

                ${
                    item.v
                    ?
                    `<div class="badge">
                        ⭐ VIP
                    </div>`
                    :
                    ""
                }

            </div>


            <div class="number">
                ${item.n}
            </div>


            <div class="tags">

                <span class="tag">
                    WhatsApp
                </span>

                <span class="tag">
                    Telegram
                </span>

            </div>


            <div class="card-bottom">

                <div class="price">

                    ${item.p}

                    <small>
                        AZN
                    </small>

                </div>


                <button
                    class="buy"
                    onclick="buyNumber(
                        '${item.country}',
                        '${item.n}',
                        '${item.p}'
                    )"
                >
                    Nömrəni al
                </button>

            </div>

        </div>
    `;

}


/* NÖMRƏLƏR */

function renderNumbers(list){

    const box =
        document.getElementById("numbers");


    if(!list.length){

        box.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    🔎
                </div>

                Nəticə tapılmadı

            </div>
        `;

    }else{

        box.innerHTML =
            list.map(createCard).join("");

    }


    document.getElementById("count")
        .textContent =
        list.length + " nömrə";

}


/* ÖLKƏ FİLTRİ */

let currentCountry = "all";


function filterCountry(country,button){

    currentCountry = country;


    document.querySelectorAll(".cat")
        .forEach(item=>{
            item.classList.remove("active");
        });


    button.classList.add("active");


    let result =
        country === "all"
        ?
        numbers
        :
        numbers.filter(item =>
            item.c === country
        );


    renderNumbers(result);

}


/* ƏSAS AXTARIŞ */

function searchNumbers(){

    const q =
        document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    let result =
        numbers.filter(item=>{

            const text =
                (
                    item.country +
                    " " +
                    item.n +
                    " " +
                    item.c
                ).toLowerCase();


            return text.includes(q);

        });


    if(currentCountry !== "all"){

        result =
            result.filter(item =>
                item.c === currentCountry
            );

    }


    renderNumbers(result);

}


/* VIP */

function renderVIP(list){

    const box =
        document.getElementById("vipNumbers");


    if(!list.length){

        box.innerHTML = `

                <div class="empty-icon">

                </div>

                VIP nömrə tapılmadı

            </div>
        `;

        return;

    }


    box.innerHTML =
        list.map(createCard).join("");

}


function searchVIP(){

    const q =
        document.getElementById("vipSearch")
        .value
        .toLowerCase()
        .trim();


    const result =
        numbers.filter(item=>{

            if(!item.v){
                return false;
            }


            const text =
                (
                    item.country +
                    " " +
                    item.n +
                    " " +
                    item.c
                ).toLowerCase();


            return text.includes(q);

        });


    renderVIP(result);

}

            </div>
        `;

    }else{

        box.innerHTML =
            result.map(createCard).join("");

    }

}

    document.querySelectorAll(".page")

            item.classList.remove("active");
        });


    document.getElementById(page)
        .classList.add("active");

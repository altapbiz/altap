<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altap.Biz</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    .box {
        width: 92%;
        max-width: 600px;
        text-align: center;
        padding: 40px 20px;
    }

    .line {
        margin: 14px 0;
        font-weight: 900;
        letter-spacing: 2px;
        animation: neon 2s infinite alternate;
    }

    .title {
        font-size: clamp(28px, 7vw, 52px);
    }

    .whatsapp {
        font-size: clamp(24px, 6vw, 44px);
    }

    .price {
        font-size: clamp(30px, 7vw, 48px);
    }

    .site {
        font-size: clamp(34px, 8vw, 60px);
    }

    .support {
        font-size: clamp(18px, 4.5vw, 28px);
        line-height: 1.5;
        margin-top: 28px;
    }

    .delay1 { animation-delay: 0.4s; }
    .delay2 { animation-delay: 0.9s; }
    .delay3 { animation-delay: 1.4s; }
    .delay4 { animation-delay: 1.9s; }
    .delay5 { animation-delay: 2.4s; }
    .delay6 { animation-delay: 2.9s; }

    @keyframes neon {
        0% {
            opacity: 0.25;
            text-shadow:
                0 0 2px #00ffff,
                0 0 5px #00ffff;
        }

        50% {
            opacity: 1;
            text-shadow:
                0 0 5px #00ffff,
                0 0 15px #00ffff,
                0 0 30px #00ffff,
                0 0 50px #00ffff;
        }

        100% {
            opacity: 0.35;
            text-shadow:
                0 0 3px #00ffff,
                0 0 8px #00ffff;
        }
    }
</style>
</head>

<body>

<div class="box">

    <div class="line title">YALNIZ RUSİYADA</div>

    <div class="line title delay1">YAŞAYANLAR ÜÇÜN</div>

    <div class="line whatsapp delay2">📲 WHATSAPP PLUS</div>

    <div class="line whatsapp delay3">YÜKLƏMƏ SAYTI</div>

    <div class="line site delay4">Altap.Biz</div>

    <div class="line price delay5">20 AZN</div>

    <div class="line support delay6">
        WhatsApp Plus yükləmək istəyənlər bizə yazın WhatsApp da dəstək xidməti olsun
    </div>

    <div class="line site delay1">Altap.Biz</div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALTAP.BİZ — Xəbərlər</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f5f7;
    color:#111;
}

header{
    background:#101010;
    color:#fff;
    padding:18px 15px;
    position:sticky;
    top:0;
    z-index:100;
}

.header{
    max-width:1150px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:26px;
    font-weight:900;
    letter-spacing:-1px;
}

.live{
    color:#ff3030;
    font-size:13px;
    font-weight:bold;
}

nav{
    background:#fff;
    border-bottom:1px solid #ddd;
    overflow-x:auto;
}

.nav{
    max-width:1150px;
    margin:auto;
    display:flex;
    gap:8px;
    padding:12px 15px;
}

.nav button{
    border:0;
    background:#eee;
    color:#111;
    padding:10px 18px;
    border-radius:22px;
    font-weight:bold;
    cursor:pointer;
    white-space:nowrap;
}

.nav button.active{
    background:#111;
    color:#fff;
}

main{
    max-width:1150px;
    margin:25px auto;
    padding:0 15px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.top h1{
    font-size:28px;
}

.updated{
    color:#777;
    font-size:12px;
}

.news{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 4px 18px rgba(0,0,0,.07);
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:0 7px 22px rgba(0,0,0,.12);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
    background:#ddd;
}

.content{
    padding:16px;
}

.source{
    font-size:11px;
    font-weight:bold;
    color:#e00000;
    margin-bottom:8px;
    text-transform:uppercase;
}

.content h2{
    font-size:18px;
    line-height:1.4;
    margin-bottom:10px;
}

.content p{
    color:#666;
    font-size:14px;
    line-height:1.5;
    margin-bottom:13px;
}

.date{
    color:#999;
    font-size:12px;
}

.loading{
    grid-column:1/-1;
    background:#fff;
    padding:45px;
    border-radius:16px;
    text-align:center;
}

.error{
    grid-column:1/-1;
    background:#fff;
    padding:40px;
    border-radius:16px;
    text-align:center;
}

footer{
    margin-top:45px;
    background:#101010;
    color:#999;
    text-align:center;
    padding:25px;
    font-size:13px;
}

@media(max-width:850px){
    .news{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){

    .logo{
        font-size:22px;
    }

    .news{
        grid-template-columns:1fr;
    }

    .card img{
        height:220px;
    }

    .top{
        display:block;
    }

    .updated{
        display:block;
        margin-top:8px;
    }

    .top h1{
        font-size:24px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header">
        <div class="logo">ALTAP.BİZ</div>
        <div class="live">● CANLI XƏBƏRLƏR</div>
    </div>
</header>

<nav>
    <div class="nav">

        <button class="active"
        onclick="changeCategory('azerbaijan',this)">
            Azərbaycan
        </button>

        <button
        onclick="changeCategory('world',this)">
            Dünya
        </button>

        <button
        onclick="changeCategory('sports',this)">
            İdman
        </button>

        <button
        onclick="changeCategory('technology',this)">
            Texnologiya
        </button>

    </div>
</nav>

<main>

    <div class="top">

        <h1>Son xəbərlər</h1>

        <div class="updated" id="updated">
            Xəbərlər yüklənir...
        </div>

    </div>

    <div class="news" id="news">

        <div class="loading">
            Xəbərlər yüklənir...
        </div>

    </div>

</main>

<footer>
    © 2026 ALTAP.BİZ — Bütün hüquqlar qorunur.
</footer>


<script>

const newsContainer = document.getElementById("news");
const updated = document.getElementById("updated");

let currentCategory = "azerbaijan";


/*
   Azərbaycan xəbər mənbələri.
   Google News bu mənbələrdəki xəbərləri
   RSS formatında bizə qaytarır.
*/

const categories = {

    azerbaijan:
    '(site:apa.az OR site:report.az OR site:trend.az OR site:azertag.az OR site:oxu.az OR site:modern.az)',

    world:
    '(site:apa.az OR site:report.az OR site:trend.az OR site:azertag.az) dünya',

    sports:
    '(site:apa.az OR site:report.az OR site:trend.az OR site:azertag.az) idman',

    technology:
    '(site:apa.az OR site:report.az OR site:trend.az OR site:azertag.az) texnologiya'

};


/*
   Rusca xəbərləri filtrdən keçiririk.
*/

function isAzerbaijani(title){

    if(!title) return false;

    const russianLetters =
    (title.match(/[ёыэъьщшжцч]/gi) || []).length;

    const cyrillicLetters =
    (title.match(/[А-Яа-яЁё]/g) || []).length;

    if(cyrillicLetters > 0){

        const ratio =
        russianLetters / Math.max(title.length,1);

        if(ratio > 0.03){
            return false;
        }
    }

    return true;
}


/*
   Mənbə adını tapırıq.
*/

function getSource(title){

    if(title.includes("APA")){
        return "APA";
    }

    if(title.includes("Report")){
        return "REPORT";
    }

    if(title.includes("Trend")){
        return "TREND";
    }

    if(title.includes("AZƏRTAC")){
        return "AZƏRTAC";
    }

    return "ALTAP.BİZ";
}


/*
   Xəbər şəklini tapmağa çalışırıq.
*/

function getImage(item){

    if(item.enclosure && item.enclosure.link){
        return item.enclosure.link;
    }

    if(item.thumbnail){
        return item.thumbnail;
    }

    if(item.description){

        const match =
        item.description.match(/<img[^>]+src=["']([^"']+)["']/i);

        if(match){
            return match[1];
        }
    }

    return "https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1000&q=80";
}


/*
   Xəbərləri yükləyirik.
*/

async function loadNews(category=currentCategory){

    currentCategory = category;

    newsContainer.innerHTML = `
        <div class="loading">
            <h3>Xəbərlər yüklənir...</h3>
            <p style="margin-top:8px;color:#777">
                Ən son xəbərlər axtarılır
            </p>
        </div>
    `;

    const search =
    categories[category];

    const rssURL =
    "https://news.google.com/rss/search?q=" +
    encodeURIComponent(search) +
    "&hl=az&gl=AZ&ceid=AZ:az";

    const apiURL =
    "https://api.rss2json.com/v1/api.json?rss_url=" +
    encodeURIComponent(rssURL);


    try{

        const response =
        await fetch(apiURL);

        const data =
        await response.json();

        if(!data.items || data.items.length === 0){

            throw new Error("Xəbər tapılmadı");

        }


        /*
           Rusca xəbərləri çıxarırıq.
        */

        const filtered =
        data.items.filter(item =>
            isAzerbaijani(item.title)
        );


        newsContainer.innerHTML = "";


        filtered.slice(0,18).forEach(item => {

            const title =
            item.title || "Başlıqsız xəbər";


            const description =
            item.description
            ? item.description
                .replace(/<[^>]*>/g,"")
                .trim()
                .slice(0,180)
            : "Ətraflı məlumat üçün xəbəri açın.";


            const date =
            item.pubDate
            ? new Date(item.pubDate)
            : new Date();


            const image =
            getImage(item);


            const source =
            getSource(title);


            const card =
            document.createElement("article");


            card.className = "card";


            card.innerHTML = `

                <img
                    src="${image}"
                    alt="Xəbər şəkli"
                    onerror="
                    this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1000&q=80'
                    "
                >

                <div class="content">

                    <div class="source">
                        ${source}
                    </div>

                    <h2>
                        ${title}
                    </h2>

                    <p>
                        ${description}...
                    </p>

                    <div class="date">
                        ${date.toLocaleString("az-AZ")}
                    </div>

                </div>
            `;


            card.onclick = function(){

                if(item.link){

                    window.open(
                        item.link,
                        "_blank"
                    );

                }

            };


            newsContainer.appendChild(card);

        });


        if(newsContainer.children.length === 0){

            newsContainer.innerHTML = `
                <div class="error">
                    <h3>
                        Hazırda uyğun Azərbaycan dilində xəbər tapılmadı.
                    </h3>

                    <p style="margin-top:8px;color:#777">
                        Bir neçə dəqiqədən sonra yenidən yoxlanılacaq.
                    </p>
                </div>
            `;

        }


        updated.innerText =
        "Son yenilənmə: " +
        new Date().toLocaleTimeString("az-AZ");

    }


    catch(error){

        console.error(error);

        newsContainer.innerHTML = `

            <div class="error">

                <h3>
                    Xəbərləri yükləmək mümkün olmadı
                </h3>

                <p style="margin-top:8px;color:#777">
                    İnternet bağlantısını və ya xəbər xidmətini yoxlayın.
                </p>

            </div>

        `;

        updated.innerText =
        "Yenilənmə zamanı xəta baş verdi";

    }

}


/*
   Kateqoriya dəyişdirilir.
*/

function changeCategory(category,button){

    currentCategory =
    category;


    document
    .querySelectorAll(".nav button")
    .forEach(btn => {

        btn.classList.remove("active");

    });


    button.classList.add("active");


    loadNews(category);

}


/*
   Sayt açılan kimi Azərbaycan xəbərləri.
*/

loadNews("azerbaijan");


/*
   Hər 5 dəqiqədən bir avtomatik yenilənir.
*/

setInterval(function(){

    loadNews(currentCategory);

}, 300000);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Takipçi</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:#050505;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:300px;
    height:300px;
    background:#00f2ea;
    filter:blur(130px);
    opacity:.18;
    top:-100px;
    left:-100px;
}

body::after{
    content:"";
    position:fixed;
    width:300px;
    height:300px;
    background:#ff0050;
    filter:blur(130px);
    opacity:.18;
    bottom:-100px;
    right:-100px;
}

.container{
    width:100%;
    max-width:520px;
    position:relative;
    z-index:2;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.tiktok{
    font-size:54px;
    font-weight:900;
    text-shadow:
        -3px 0 #00f2ea,
        3px 0 #ff0050;
    margin-bottom:8px;
}

.header h1{
    font-size:28px;
    font-weight:800;
}

.header p{
    margin-top:7px;
    color:#aaa;
    font-size:14px;
}

.packages{
    display:grid;
    gap:14px;
}

.package{
    position:relative;
    background:linear-gradient(145deg,#151515,#0b0b0b);
    border:1px solid #292929;
    border-radius:18px;
    padding:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    transition:.25s ease;
    overflow:hidden;
}

.package::before{
    content:"";
    position:absolute;
    width:80px;
    height:80px;
    background:#00f2ea;
    filter:blur(55px);
    opacity:0;
    transition:.25s;
}

.package:hover{
    transform:translateY(-3px);
    border-color:#00f2ea;
    box-shadow:0 0 25px rgba(0,242,234,.12);
}

.package.selected{
    border-color:#ff0050;
    box-shadow:
        0 0 18px rgba(255,0,80,.18),
        0 0 25px rgba(0,242,234,.08);
    transform:scale(1.025);
}

.package.selected::before{
    opacity:.35;
}

.info{
    position:relative;
    z-index:2;
}

.followers{
    font-size:21px;
    font-weight:800;
}

.label{
    color:#999;
    font-size:13px;
    margin-top:4px;
}

.price{
    position:relative;
    z-index:2;
    font-size:21px;
    font-weight:900;
    color:#fff;
}

.order{
    width:100%;
    margin-top:20px;
    border:0;
    border-radius:17px;
    padding:18px;
    font-size:18px;
    font-weight:900;
    color:white;
    cursor:pointer;
    background:linear-gradient(90deg,#00f2ea,#ff0050);
    box-shadow:0 8px 30px rgba(255,0,80,.18);
    transition:.2s;
}

.order:hover{
    transform:translateY(-2px);
}

.order:active{
    transform:scale(.98);
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:10;
}

.modal{
    width:100%;
    max-width:390px;
    background:#111;
    border:1px solid #333;
    border-radius:22px;
    padding:28px;
    text-align:center;
    box-shadow:0 0 50px rgba(0,0,0,.6);
    animation:popup .25s ease;
}

@keyframes popup{
    from{
        opacity:0;
        transform:scale(.9);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.modal h2{
    font-size:23px;
    margin-bottom:10px;
}

.modal p{
    color:#aaa;
    font-size:14px;
    line-height:1.5;
    margin-bottom:22px;
}

.modal-buttons{
    display:flex;
    gap:10px;
}

.modal button{
    flex:1;
    padding:15px;
    border:0;
    border-radius:13px;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
}

.cancel{
    background:#242424;
    color:white;
}

.continue{
    background:#25D366;
    color:white;
}

@media(max-width:420px){
    .package{
        padding:17px;
    }

    .followers,
    .price{
        font-size:18px;
    }

    .tiktok{
        font-size:46px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="tiktok">TikTok</div>
        <h1>Takipçi Paketləri</h1>
        <p>Paketi seçin və sifariş edin</p>
    </div>

    <div class="packages">

        <div class="package" onclick="selectPackage(this,'1000 takipçi','7,87₼')">
            <div class="info">
                <div class="followers">1.000 takipçi</div>
                <div class="label">TikTok paket</div>
            </div>
            <div class="price">7,87₼</div>
        </div>

        <div class="package" onclick="selectPackage(this,'2000 takipçi','15,63₼')">
            <div class="info">
                <div class="followers">2.000 takipçi</div>
                <div class="label">TikTok paket</div>
            </div>
            <div class="price">15,63₼</div>
        </div>

        <div class="package" onclick="selectPackage(this,'5000 takipçi','27,87₼')">
            <div class="info">
                <div class="followers">5.000 takipçi</div>
                <div class="label">TikTok paket</div>
            </div>
            <div class="price">27,87₼</div>
        </div>

        <div class="package" onclick="selectPackage(this,'10.000 takipçi','48,55₼')">
            <div class="info">
                <div class="followers">10.000 takipçi</div>
                <div class="label">TikTok paket</div>
            </div>
            <div class="price">48,55₼</div>
        </div>

    </div>

    <button class="order" onclick="openConfirm()">Sifariş et</button>

</div>

<div class="overlay" id="overlay">
    <div class="modal">
        <h2>Razısız?</h2>
        <p id="selectedText"></p>

        <div class="modal-buttons">
            <button class="cancel" onclick="closeConfirm()">Xeyr</button>
            <button class="continue" onclick="goWhatsApp()">Davam et</button>
        </div>
    </div>
</div>

<script>
let selectedPackage = null;
let selectedPrice = null;

function selectPackage(element, pack, price){

    document.querySelectorAll('.package').forEach(item=>{
        item.classList.remove('selected');
    });

    element.classList.add('selected');

    selectedPackage = pack;
    selectedPrice = price;
}

function openConfirm(){

    if(!selectedPackage){
        return;
    }

    document.getElementById("selectedText").innerHTML =
        selectedPackage + " — " + selectedPrice;

    document.getElementById("overlay").style.display = "flex";
}

function closeConfirm(){
    document.getElementById("overlay").style.display = "none";
}

function goWhatsApp(){

    const message =
        "Salam, " +
        selectedPackage +
        " sifariş etmək istəyirəm. Qiymət: " +
        selectedPrice;

    const url =
        "https://wa.me/994552334814?text=" +
        encodeURIComponent(message);

    window.location.href = url;
}

document.getElementById("overlay").addEventListener("click",function(e){
    if(e.target === this){
        closeConfirm();
    }
});
</script>

</body>
</html>
